spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DATABASE_HIBERNATE_ACCESS}
spring.jpa.show-sql=true

image.kit.url=${IMAGE_KIT_URL}
image.kit.public.key=${IMAGE_KIT_PUBLIC_KEY}
image.kit.private.key=${IMAGE_KIT_PRIVATE_KEY}

jwt.expirationtime=${JWT_TOKEN_EXPIRATION_TIME}
jwt.secret.password=${JWT_TOKEN_SECRET_PASSWORD}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

email.address=${EMAIL}
email.password=${APP_PASSWORD}


